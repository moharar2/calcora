name: Phase 1 SEO validation

on:
  push:
    branches:
      - seo/phase1-audit-fix

permissions:
  contents: write

jobs:
  validate-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies and refresh lockfile
        run: pnpm install

      - name: Remove duplicate React SEO writers from Home
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path("client/src/pages/Home.tsx")
          source = path.read_text(encoding="utf-8")

          source, calculator_count = re.subn(
              r'useEffect\(\(\) => \{.*?\}, \[content\]\); ',
              '',
              source,
              count=1,
              flags=re.DOTALL,
          )
          source, home_count = re.subn(
              r'useEffect\(\(\) => \{.*?\}, \[resolvedLocation\]\); ',
              '',
              source,
              count=1,
              flags=re.DOTALL,
          )
          source = re.sub(r'const infoMeta: Record<string, \[string, string\]> = \{.*?\};\n', '', source, count=1, flags=re.DOTALL)

          if calculator_count != 1 or home_count != 1:
              raise SystemExit(f"Expected both duplicate SEO effects to be removed; calculator={calculator_count}, home={home_count}")
          if "document.title" in source or "meta[name=\\\"description\\\"]" in source:
              raise SystemExit("Home.tsx still contains a duplicate runtime SEO writer")

          path.write_text(source, encoding="utf-8")
          PY

      - name: Generate initial SEO script from shared source
        run: pnpm generate:initial-seo

      - name: Run required checks
        run: |
          pnpm test
          pnpm run check
          pnpm run build
          pnpm run seo:audit

      - name: Commit synchronized SEO changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No generated or dependency changes to commit."
          else
            git add package.json pnpm-lock.yaml client/public/initial-seo.js client/src/pages/Home.tsx
            git commit -m "seo: synchronize generated metadata and dependencies"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
