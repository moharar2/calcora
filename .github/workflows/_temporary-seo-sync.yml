name: Temporary SEO sync

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: seo/phase1-audit-fix
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: corepack enable
      - name: Remove duplicate Home SEO writers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          path = Path('client/src/pages/Home.tsx')
          source = path.read_text(encoding='utf-8')
          source, calc = re.subn(r'useEffect\(\(\) => \{.*?\}, \[content\]\); ', '', source, count=1, flags=re.DOTALL)
          source, home = re.subn(r'useEffect\(\(\) => \{.*?\}, \[resolvedLocation\]\); ', '', source, count=1, flags=re.DOTALL)
          source, info = re.subn(r'const infoMeta: Record<string, \[string, string\]> = \{.*?\};\n', '', source, count=1, flags=re.DOTALL)
          if (calc != 1 or home != 1 or info != 1 or 'document.title' in source:
              raise SystemExit(f'Unexpected Home SEO structure: calc={calc}, home={home}, info={info}')
          path.write_text(source, encoding='utf-8')
          PY
      - run: pnpm install
      - run: pnpm generate:initial-seo
      - run: pnpm test
      - run: pnpm run check
      - run: pnpm run build
      - run: pnpm run seo:audit
      - name: Commit target branch changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json pnpm-lock.yaml client/public/initial-seo.js client/src/pages/Home.tsx
          git commit -m 'seo: synchronize generated metadata and dependencies'
          git push origin HEAD:seo/phase1-audit-fix
